services:
  weather:
    build: .
    image: "nimarion/weathercloudscraper"
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"

  prometheus:
    image: "prom/prometheus:latest"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - weather

  grafana:
    image: "grafana/grafana:latest"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
